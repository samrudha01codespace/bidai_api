services:
  postgres:
    image: postgres:16-alpine
    container_name: bidai_api_postgres
    environment:
      POSTGRES_USER: bidai
      POSTGRES_PASSWORD: bidai_secret
      POSTGRES_DB: bidai_db
    ports:
      - "5432:5432"
    volumes:
      - bidai_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidai -d bidai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bidai_pgdata:
